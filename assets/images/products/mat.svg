<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C6E66"/>
      <stop offset="100%" stop-color="#163C37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="330" cy="60" r="70" fill="#ffffff" opacity="0.06"/>
  <circle cx="50" cy="240" r="60" fill="#ffffff" opacity="0.05"/>

  <g transform="translate(90,95) rotate(-8)" fill="none" stroke="#F6F1E4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- unrolled flat section -->
    <rect x="40" y="0" width="170" height="46" rx="10" fill="#D9A62E" fill-opacity="0.92" stroke="#F6F1E4"/>
    <!-- rolled cylinder end -->
    <circle cx="40" cy="23" r="23" fill="#F6F1E4" fill-opacity="0.16"/>
    <circle cx="40" cy="23" r="10" fill="none" stroke-width="3"/>
    <!-- carry strap -->
    <path d="M120 46 C120 66 150 66 150 46" stroke-width="3.5" opacity="0.8"/>
  </g>
</svg>
