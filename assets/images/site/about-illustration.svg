<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgAbout" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C6E66"/>
      <stop offset="100%" stop-color="#163C37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="520" fill="url(#bgAbout)"/>
  <circle cx="60" cy="80" r="90" fill="#ffffff" opacity="0.05"/>
  <circle cx="360" cy="460" r="120" fill="#ffffff" opacity="0.05"/>

  <!-- clipboard / shortlist card -->
  <g transform="translate(90,140)">
    <rect x="0" y="0" width="220" height="280" rx="16" fill="#F6F1E4"/>
    <rect x="70" y="-14" width="80" height="26" rx="8" fill="#D9A62E"/>
    <g stroke="#D9CCA6" stroke-width="2">
      <line x1="26" y1="60" x2="194" y2="60"/>
      <line x1="26" y1="112" x2="194" y2="112"/>
      <line x1="26" y1="164" x2="194" y2="164"/>
      <line x1="26" y1="216" x2="194" y2="216"/>
    </g>
    <g fill="none" stroke="#22564F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 44 l8 8 14 -16"/>
      <path d="M30 96 l8 8 14 -16"/>
      <path d="M30 148 l8 8 14 -16"/>
    </g>
    <rect x="30" y="200" width="20" height="20" rx="4" fill="none" stroke="#B85436" stroke-width="3"/>
    <text x="66" y="55" font-family="Georgia, serif" font-size="18" fill="#201B14">Try it first</text>
    <text x="66" y="107" font-family="Georgia, serif" font-size="18" fill="#201B14">Compare the field</text>
    <text x="66" y="159" font-family="Georgia, serif" font-size="18" fill="#201B14">Keep it short</text>
    <text x="66" y="211" font-family="Georgia, serif" font-size="18" fill="#8a8371">Label the link</text>
  </g>

  <!-- floating stamp -->
  <g transform="translate(268,90) rotate(12)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#D9A62E" stroke-width="3" stroke-dasharray="5 6"/>
    <text x="0" y="6" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#F6F1E4" text-anchor="middle">APPROVED</text>
  </g>
</svg>
